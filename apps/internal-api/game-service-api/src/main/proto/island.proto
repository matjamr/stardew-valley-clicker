syntax = "proto3";

option java_multiple_files = true;
option java_package = "com.mat.jamr.gameservice.api";
option java_outer_classname = "IslandGrpcService";

import 'asset.proto';

service IslandService {
  rpc Create (CreateIslandRequest) returns (CreateIslandResponse) {}
  rpc Read (ReadIslandRequest) returns (ReadIslandResponse) {}
  rpc Update (UpdateIslandRequest) returns (UpdateIslandResponse) {}
  rpc ListAll (ListAllIslandsRequest) returns (ListAllIslandsResponse) {}
  rpc GenerateCollectables (GenerateCollectablesRequest) returns (GenerateCollectablesResponse) {}
  rpc CollectTerrainCollectable (CollectTerrainCollectableRequest) returns (CollectTerrainCollectableResponse) {}
}

service IslandVariantService {
  rpc Read (ReadIslandVariantRequest) returns (IslandVariant) {}
  rpc ListAll (ListAllIslandVariantsRequest) returns (ListAllIslandVariantsResponse) {}
}

message CreateIslandRequest {
  string userId = 1;
  string variantId = 2;
  string name = 3;
}

message CreateIslandResponse {
  string id = 1;
}

message ReadIslandRequest {
  string islandId = 1;
}

message ReadIslandResponse {
  Island island = 1;
}

message UpdateIslandRequest {
  string islandId = 1;
  Island island = 2;
}

message UpdateIslandResponse {
  bool success = 1;
  string message = 2;
}

message GenerateCollectablesRequest {
  string islandId = 1;
  int32 count = 2; // Number of collectables to generate (optional, defaults to 3-5)
}

message GenerateCollectablesResponse {
  bool success = 1;
  string message = 2;
  int32 count = 3; // Actual number of collectables generated
}

message CollectTerrainCollectableRequest {
  string islandId = 1;
  string collectableId = 2;
}

message CollectTerrainCollectableResponse {
  bool success = 1;
  string message = 2;
  RewardInfo rewards = 3; // Rewards collected
}

message ListAllIslandsRequest {
  string ownerId = 1;
}

message ListAllIslandsResponse {
  repeated Island islands = 1;
}

enum IslandVariantType {
  DEFAULT = 0;
  CLASSIC = 1;
  FOREST = 2;
}

message ReadIslandVariantRequest {
  string id = 1;
}

message ListAllIslandVariantsRequest {
  // Empty request for now, can add pagination/filtering later
}

message ListAllIslandVariantsResponse {
  repeated IslandVariant variants = 1;
}

message IslandVariant {
  string id = 1;
  string name = 2;
  string ownerId = 3;
  string namedVariant = 4;
  Farm farmTemplate = 5;
  Barn barnTemplate = 6;
  Mines minesTemplate = 7;
  FishingArea fishingAreaTemplate = 8;

}

message Island {
  string id = 1;
  string name = 2;
  string ownerId = 3;
  string namedVariant = 4;
  repeated string allowedPlayers = 5;
  string createdAt = 6;
  string updatedAt = 7;
  Farm farm = 8;
  Barn barn = 9;
  Mines mines = 10;
  FishingArea fishingArea = 11;
  Bag bag = 12;
}

message Bag {
  repeated BagItem items = 1;
  int32 maxSlots = 2; // Maximum number of item slots (e.g., 20, 40)
}

message BagItem {
  string itemId = 1; // References ShopItem.id
  string name = 2;
  int32 quantity = 3;
  string iconUrl = 4;
}

message Farm {
  string id = 1;
  string name = 2;
  int32 sizeX = 3;
  int32 sizeY = 4;
  int32 blockSize = 5;
  repeated CropPlot plots = 6;
  repeated Decoration decorations = 7;
  repeated TerrainCollectable terrainCollectables = 8;
}

message CropPlot {
  int32 x = 1;
  int32 y = 2;
  int32 sizeX = 3;
  int32 sizeY = 4;
  Asset asset = 5;
  string cropId = 6;
  string plantedAt = 7;
  int32 growthStage = 8;
  bool isWatered = 9;
}

message Barn {
  string id = 1;
  string name = 2;
  int32 sizeX = 3;
  int32 sizeY = 4;
  int32 blockSize = 5;
  repeated AnimalPen pens = 6;
  repeated Storage storageUnits = 7;
}

message AnimalPen {
  int32 x = 1;
  int32 y = 2;
  int32 sizeX = 3;
  int32 sizeY = 4;
  Asset asset = 5;
  repeated string animalIds = 6;
  int32 capacity = 7;
}

message Storage {
  int32 x = 1;
  int32 y = 2;
  int32 sizeX = 3;
  int32 sizeY = 4;
  Asset asset = 5;
  string storageId = 6;
  int32 capacity = 7;
}


message Mines {
  string id = 1;
  string name = 2;
  int32 currentLevel = 3;
  int32 maxLevel = 4;
  repeated MineLevel levels = 5;
}

message MineLevel {
  int32 level = 1;
  int32 sizeX = 2;
  int32 sizeY = 3;
  int32 blockSize = 4;
  repeated MineTile tiles = 5;
  repeated string resourceIds = 6;
  int32 difficulty = 7;
}

message MineTile {
  int32 x = 1;
  int32 y = 2;
  int32 sizeX = 3;
  int32 sizeY = 4;
  Asset asset = 5;
  string resourceId = 6;
  int32 resourceQuantity = 7;
  bool discovered = 8;
  int32 timeTaken = 9;
}

message FishingArea {
  string id = 1;
  string name = 2;
  int32 sizeX = 3;
  int32 sizeY = 4;
  int32 blockSize = 5;
  repeated FishingSpot spots = 6;
  repeated string availableFishIds = 7;
}

message FishingSpot {
  int32 x = 1;
  int32 y = 2;
  int32 sizeX = 3;
  int32 sizeY = 4;
  Asset asset = 5;
  int32 quality = 6;
  repeated string specificFishIds = 7;
}

message Decoration {
  int32 x = 1;
  int32 y = 2;
  int32 sizeX = 3;
  int32 sizeY = 4;
  Asset asset = 5;
}

message TerrainCollectable {
  string id = 1;
  int32 x = 2;
  int32 y = 3;
  int32 sizeX = 4;
  int32 sizeY = 5;
  Asset asset = 6;
  TerrainCollectableType type = 7;
  bool isCollected = 8;
  string collectedAt = 9;
}

enum TerrainCollectableType {
  TERRAIN_COLLECTABLE_UNSPECIFIED = 0;
  BUSH = 1;
  ROCK = 2;
  TREE = 3;
}

message Building {
  string id = 1;
  string name = 2;
  string type = 3;
  int32 x = 4;
  int32 y = 5;
  int32 level = 6;
  string ownerId = 7;
}

message IslandBag {
  string id = 1;
  string islandId = 2;
  repeated Item items = 3;
  int32 capacity = 4;
}

message Item {
  string id = 1;
  string name = 2;
  string type = 3;
  int32 quantity = 4;
}
